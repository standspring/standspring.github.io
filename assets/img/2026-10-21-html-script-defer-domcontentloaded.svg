<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="1140" viewBox="0 0 1520 1140" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">일반 script, async, defer의 실행 순서와 DOMContentLoaded</title>
  <desc id="diagram-desc">초기 HTML에 선언한 외부 클래식 스크립트의 개념도다. 일반 script는 다운로드와 실행 동안 HTML 파싱을 멈춘다. async는 파싱과 병행하여 다운로드하고 준비되면 실행하며, 실행 중에는 파싱이 멈출 수 있다. async 실행은 DOMContentLoaded 전후 모두 가능하고 문서 순서를 보장하지 않으며, DOMContentLoaded는 async 파일 로딩을 기다리지 않는다. defer는 파싱과 병행하여 다운로드하고 HTML 파싱이 끝난 뒤 문서 순서대로 실행되며, 그 후 DOMContentLoaded가 발생한다. 기본 모듈도 파싱 후 평가를 시작하지만 비동기 초기화 완료는 별도 확인해야 한다. defer 파일은 DOM을 바로 초기화할 수 있다. 실행 시점을 모르는 파일은 readyState가 loading이면 DOMContentLoaded 리스너를 등록하고, 그 외에는 바로 초기화한다. jQuery ready는 늦게 등록해도 실행되지만 네이티브 이벤트는 재발생하지 않는다. 선 길이는 실제 성능 비교를 나타내지 않는다.</desc>
  <defs>
    <style>
      text { font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; fill: #172b45; }
      .title { font-size: 40px; font-weight: 800; letter-spacing: -1.2px; }
      .subtitle { font-size: 25px; fill: #52647a; }
      .section { font-size: 31px; font-weight: 750; }
      .label { font-size: 24px; font-weight: 700; }
      .body { font-size: 23px; }
      .small { font-size: 21px; fill: #52647a; }
      .tiny { font-size: 19px; fill: #52647a; }
      .mono { font-family: "Cascadia Code", "Consolas", "Malgun Gothic", monospace; font-size: 19px; }
      .center { text-anchor: middle; }
      .parse { fill: #238a81; }
      .download { fill: #eee8fb; stroke: #8262b8; stroke-width: 2; stroke-dasharray: 7 5; }
      .execute { fill: #eea34b; }
      .dcl-line { stroke: #285b98; stroke-width: 3; }
      .dcl { fill: #285b98; font-size: 21px; font-weight: 750; }
    </style>
    <marker id="time-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1 1 9 5 1 9Z" fill="#9aa8ba"/>
    </marker>
  </defs>

  <rect width="1520" height="1140" rx="28" fill="#f7f9fc"/>
  <text x="64" y="78" class="title">script 로딩 방식과 DOM 준비 시점</text>
  <text x="66" y="123" class="subtitle">다운로드 시점과 실행 시점을 나누어 보면 defer가 필요한 이유가 보인다.</text>

  <g aria-label="그림의 범례">
    <rect x="66" y="158" width="40" height="18" rx="5" class="parse"/>
    <text x="119" y="176" class="small">HTML 파싱</text>
    <rect x="300" y="158" width="40" height="18" rx="5" class="download"/>
    <text x="353" y="176" class="small">다운로드</text>
    <rect x="527" y="158" width="40" height="18" rx="5" class="execute"/>
    <text x="580" y="176" class="small">JS 실행</text>
    <path d="M748 154V181" class="dcl-line"/>
    <circle cx="748" cy="166" r="6" fill="#285b98"/>
    <text x="765" y="176" class="small">DOMContentLoaded (DCL)</text>
    <path d="M1200 168H1445" fill="none" stroke="#9aa8ba" stroke-width="2" marker-end="url(#time-arrow)"/>
    <text x="1318" y="157" class="tiny center">시간 흐름 · 개념도</text>
  </g>

  <g aria-label="일반 script는 다운로드와 실행 동안 HTML 파싱을 멈춘다">
    <rect x="64" y="211" width="1392" height="194" rx="20" fill="#ffffff" stroke="#dce4ed" stroke-width="2"/>
    <text x="91" y="256" class="section">일반 script</text>
    <text x="92" y="292" class="mono">&lt;script src="a.js"&gt;</text>
    <text x="92" y="332" class="small">파싱 도중 실행</text>

    <text x="680" y="252" class="small center">파싱 대기</text>
    <path d="M570 269H820" fill="none" stroke="#c8d2df" stroke-width="4" stroke-dasharray="7 7"/>
    <rect x="400" y="270" width="170" height="30" rx="7" class="parse"/>
    <text x="485" y="292" class="tiny center" style="fill:#ffffff">HTML</text>
    <rect x="820" y="270" width="100" height="30" rx="7" class="execute"/>
    <text x="870" y="292" class="tiny center" style="fill:#663b0b">실행</text>
    <rect x="920" y="270" width="370" height="30" rx="7" class="parse"/>
    <text x="1105" y="292" class="tiny center" style="fill:#ffffff">HTML 계속</text>
    <path d="M570 302V319M820 302V319" fill="none" stroke="#b6a3d5" stroke-width="2"/>
    <rect x="570" y="319" width="250" height="29" rx="7" class="download"/>
    <text x="695" y="341" class="tiny center" style="fill:#654690">다운로드</text>
    <path d="M1334 259V316" class="dcl-line"/>
    <circle cx="1334" cy="285" r="7" fill="#285b98"/>
    <text x="1334" y="342" class="dcl center">DCL</text>
    <text x="400" y="382" class="small">다운로드와 실행이 끝난 뒤, 나머지 HTML을 파싱한다.</text>
  </g>

  <g aria-label="async는 파싱과 병행하여 다운로드하고 준비되면 실행한다">
    <rect x="64" y="425" width="1392" height="194" rx="20" fill="#ffffff" stroke="#dce4ed" stroke-width="2"/>
    <text x="91" y="470" class="section">async</text>
    <text x="92" y="506" class="mono">&lt;script async</text>
    <text x="92" y="533" class="mono">  src="a.js"&gt;</text>
    <text x="92" y="573" class="small">준비되면 실행</text>

    <text x="810" y="466" class="small center">실행 중 파싱 대기</text>
    <rect x="400" y="484" width="360" height="30" rx="7" class="parse"/>
    <text x="580" y="506" class="tiny center" style="fill:#ffffff">HTML</text>
    <rect x="760" y="484" width="100" height="30" rx="7" class="execute"/>
    <text x="810" y="506" class="tiny center" style="fill:#663b0b">실행</text>
    <rect x="860" y="484" width="395" height="30" rx="7" class="parse"/>
    <text x="1057" y="506" class="tiny center" style="fill:#ffffff">HTML 계속</text>
    <rect x="570" y="533" width="190" height="29" rx="7" class="download"/>
    <text x="665" y="555" class="tiny center" style="fill:#654690">다운로드</text>
    <path d="M760 516V531" fill="none" stroke="#b6a3d5" stroke-width="2"/>
    <path d="M1299 473V530" class="dcl-line"/>
    <circle cx="1299" cy="499" r="7" fill="#285b98"/>
    <text x="1299" y="556" class="dcl center">DCL</text>
    <text x="400" y="597" class="small">DCL 전후 모두 가능 · 순서 보장 없음 · DCL은 async 로딩을 기다리지 않음</text>
  </g>

  <g aria-label="defer는 HTML 파싱 후 문서 순서대로 실행되고 그 후 DOMContentLoaded가 발생한다">
    <rect x="64" y="639" width="1392" height="194" rx="20" fill="#ffffff" stroke="#dce4ed" stroke-width="2"/>
    <text x="91" y="684" class="section">defer</text>
    <text x="92" y="720" class="mono">&lt;script defer</text>
    <text x="92" y="747" class="mono">  src="a.js"&gt;</text>
    <text x="92" y="787" class="small">파싱이 끝난 뒤 실행</text>

    <text x="1130" y="680" class="small center">파싱 완료</text>
    <rect x="400" y="698" width="730" height="30" rx="7" class="parse"/>
    <text x="765" y="720" class="tiny center" style="fill:#ffffff">HTML 파싱</text>
    <rect x="1130" y="698" width="125" height="30" rx="7" class="execute"/>
    <text x="1192" y="720" class="tiny center" style="fill:#663b0b">실행</text>
    <rect x="570" y="747" width="330" height="29" rx="7" class="download"/>
    <text x="735" y="769" class="tiny center" style="fill:#654690">다운로드</text>
    <path d="M1299 687V744" class="dcl-line"/>
    <circle cx="1299" cy="713" r="7" fill="#285b98"/>
    <text x="1299" y="770" class="dcl center">DCL</text>
    <text x="400" y="811" class="small">DOM 완성 → defer 파일을 문서 순서대로 실행 → DOMContentLoaded</text>
  </g>

  <g aria-label="모듈 스크립트의 기본 동작과 비동기 초기화">
    <rect x="64" y="853" width="1392" height="52" rx="13" fill="#eaf1fb"/>
    <text x="91" y="887" class="mono" style="font-size:22px;font-weight:700">type="module"</text>
    <text x="400" y="887" class="small">기본 모듈도 파싱 후 평가 시작 · await 등 비동기 초기화 완료는 별도 확인</text>
  </g>

  <g aria-label="DOM 초기화와 jQuery ready 대체 시 선택 기준">
    <rect x="64" y="927" width="452" height="145" rx="17" fill="#e8f4ef"/>
    <text x="89" y="966" class="label">defer로 불러온 외부 파일</text>
    <text x="89" y="1007" class="body">DOM을 바로 초기화</text>
    <text x="89" y="1042" class="small">준비 이벤트로 감쌀 필요가 적다.</text>

    <rect x="534" y="927" width="452" height="145" rx="17" fill="#eaf1fb"/>
    <text x="559" y="966" class="label">실행 시점을 모르는 파일</text>
    <text x="559" y="1007" class="body">loading이면 DCL 등록</text>
    <text x="559" y="1042" class="body">그 외: 바로 초기화</text>

    <rect x="1004" y="927" width="452" height="145" rx="17" fill="#fff0df"/>
    <text x="1029" y="966" class="label">jQuery ready를 바꿀 때</text>
    <text x="1029" y="1007" class="body">늦게 등록해도 실행되는 차이</text>
    <text x="1029" y="1042" class="small">네이티브 이벤트는 재발생하지 않는다.</text>
  </g>

  <text x="66" y="1111" class="tiny">초기 HTML의 외부 classic script 기준 · 시간 길이는 예시이며 성능 측정값이 아니다.</text>
</svg>
