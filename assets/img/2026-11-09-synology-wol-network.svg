<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980" role="img" aria-labelledby="title desc">
  <title id="title">QuickConnect와 NAS를 이용한 외부 WOL 경로</title>
  <desc id="desc">외부 스마트폰은 QuickConnect로 DSM에 접속해 작업 실행을 요청한다. 집 안에서 켜져 있는 NAS가 같은 LAN의 PC에 매직 패킷을 보낸다. QuickConnect를 통해 매직 패킷을 그대로 전달하는 구조가 아니다.</desc>
  <defs>
    <style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;fill:#193047}.body{font-size:25px;fill:#526779}.label{font-size:30px;font-weight:700}.small{font-size:23px;fill:#526779}</style>
    <marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#4263b7" stroke-width="2"/></marker>
    <marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#087e8b" stroke-width="2"/></marker>
  </defs>
  <rect width="1440" height="980" rx="28" fill="#f3f7fb"/><rect width="1440" height="12" fill="#087e8b"/>
  <text x="64" y="80" font-size="22" font-weight="700" style="fill:#087e8b">SYNOLOGY WOL / 01</text>
  <text x="64" y="146" font-size="46" font-weight="700">외부에서는 작업을 요청하고, NAS가 깨웁니다</text>
  <text x="64" y="199" class="body">원격 제어 요청과 LAN 안의 매직 패킷은 서로 다른 구간을 지납니다.</text>
  <rect x="48" y="246" width="394" height="400" rx="22" fill="#fff" stroke="#d3dfec" stroke-width="2"/>
  <text x="80" y="296" font-size="24" font-weight="700" style="fill:#4263b7">집 밖 · LTE / 5G</text>
  <rect x="183" y="329" width="112" height="164" rx="18" fill="#e8edfc" stroke="#4263b7" stroke-width="4"/>
  <text x="110" y="548" class="label">핸드폰 브라우저</text>
  <text x="95" y="596" class="body">DSM 로그인 → 작업 실행</text>
  <path d="M458 432H646" stroke="#4263b7" stroke-width="4" marker-end="url(#blue)"/>
  <text x="469" y="376" font-size="24" font-weight="700" style="fill:#4263b7">QuickConnect</text>
  <text x="493" y="484" class="small">관리 요청</text>
  <rect x="681" y="246" width="711" height="400" rx="22" fill="#e4f3ef" stroke="#9bc9bf" stroke-width="2"/>
  <text x="712" y="296" font-size="24" font-weight="700" style="fill:#087e8b">집 안 · 같은 LAN / 공유기·스위치로 연결</text>
  <rect x="713" y="333" width="246" height="260" rx="16" fill="#fff"/>
  <rect x="788" y="361" width="94" height="98" rx="10" fill="#e4f3ef" stroke="#087e8b" stroke-width="3"/>
  <path d="M819 376V442M850 376V442" stroke="#087e8b" stroke-width="3"/>
  <text x="752" y="506" class="label">DS215j NAS</text>
  <text x="738" y="548" class="small">켜진 상태에서 패킷 전송</text>
  <path d="M978 432H1081" stroke="#087e8b" stroke-width="4" marker-end="url(#green)"/>
  <text x="972" y="385" font-size="21" style="fill:#087e8b">매직 패킷</text>
  <rect x="1111" y="333" width="249" height="260" rx="16" fill="#fff"/>
  <rect x="1157" y="364" width="155" height="90" rx="8" fill="#e8edfc" stroke="#4263b7" stroke-width="3"/>
  <path d="M1235 454V471M1200 471H1270" stroke="#4263b7" stroke-width="4"/>
  <text x="1187" y="516" class="label">대상 PC</text>
  <text x="1140" y="558" class="small">유선 LAN · 대기 전원</text>
  <rect x="48" y="688" width="1344" height="222" rx="22" fill="#fff" stroke="#d3dfec" stroke-width="2"/>
  <text x="80" y="744" class="label">이 구조에서 필요한 조건</text>
  <text x="80" y="792" class="body">① NAS는 켜 두기     ② NAS와 PC는 같은 LAN     ③ PC의 로컬 WOL은 먼저 검증</text>
  <text x="80" y="841" class="body">QuickConnect는 DSM 접속 경로입니다. 꺼진 PC에 직접 연결하는 VPN이 아닙니다.</text>
  <text x="80" y="884" class="small">개념도 · 중계 서버 사용 여부 등 QuickConnect의 실제 접속 경로는 네트워크 환경에 따라 달라집니다.</text>
  <text x="64" y="952" class="small">작업 실행 성공, 패킷 전송 성공, PC 부팅 성공은 각각 확인해야 합니다.</text>
</svg>
