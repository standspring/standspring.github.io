<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><rect width="1200" height="620" fill="#f5f8fa"/>
<text x="48" y="70" font-family="Malgun Gothic, sans-serif" font-size="36" fill="#163445">처음 연결하는 순서: 앱키에서 현재가까지</text>
<rect x="40" y="185" width="250" height="280" rx="18" fill="white" stroke="#278c8e" stroke-width="3"/>
<text x="62" y="237" font-family="Malgun Gothic, sans-serif" font-size="28" fill="#163445">1. 계좌 선택</text>
<text x="62" y="286" font-family="Malgun Gothic, sans-serif" font-size="23" fill="#163445">포털에서 약정 신청</text>
<text x="62" y="322" font-family="Malgun Gothic, sans-serif" font-size="23" fill="#163445">App Key 발급</text>
<text x="62" y="358" font-family="Malgun Gothic, sans-serif" font-size="23" fill="#163445">App Secret 발급</text>
<rect x="335" y="185" width="250" height="280" rx="18" fill="white" stroke="#278c8e" stroke-width="3"/>
<text x="357" y="237" font-family="Malgun Gothic, sans-serif" font-size="28" fill="#163445">2. 토큰 발급</text>
<text x="357" y="286" font-family="Malgun Gothic, sans-serif" font-size="23" fill="#163445">POST /oauth2/token</text>
<text x="357" y="322" font-family="Malgun Gothic, sans-serif" font-size="23" fill="#163445">폼 인코딩 전송</text>
<text x="357" y="358" font-family="Malgun Gothic, sans-serif" font-size="23" fill="#163445">유효기간 확인</text>
<rect x="630" y="185" width="250" height="280" rx="18" fill="white" stroke="#278c8e" stroke-width="3"/>
<text x="652" y="237" font-family="Malgun Gothic, sans-serif" font-size="28" fill="#163445">3. 현재가 조회</text>
<text x="652" y="286" font-family="Malgun Gothic, sans-serif" font-size="23" fill="#163445">Bearer 토큰</text>
<text x="652" y="322" font-family="Malgun Gothic, sans-serif" font-size="23" fill="#163445">mac_address 헤더</text>
<text x="652" y="358" font-family="Malgun Gothic, sans-serif" font-size="23" fill="#163445">시장 · 종목 지정</text>
<rect x="925" y="185" width="235" height="280" rx="18" fill="white" stroke="#278c8e" stroke-width="3"/>
<text x="947" y="237" font-family="Malgun Gothic, sans-serif" font-size="28" fill="#163445">4. 응답 확인</text>
<text x="947" y="286" font-family="Malgun Gothic, sans-serif" font-size="23" fill="#163445">업무 코드 확인</text>
<text x="947" y="322" font-family="Malgun Gothic, sans-serif" font-size="23" fill="#163445">종목코드 대조</text>
<text x="947" y="358" font-family="Malgun Gothic, sans-serif" font-size="23" fill="#163445">현재가 확인</text>
<path d="M295 330 L330 330" stroke="#278c8e" stroke-width="4"/><polygon points="330,330 316,322 316,338" fill="#278c8e"/>
<text x="307" y="312" font-family="Malgun Gothic, sans-serif" font-size="22" fill="#163445"></text>
<path d="M590 330 L625 330" stroke="#278c8e" stroke-width="4"/><polygon points="625,330 611,322 611,338" fill="#278c8e"/>
<text x="602" y="312" font-family="Malgun Gothic, sans-serif" font-size="22" fill="#163445"></text>
<path d="M885 330 L920 330" stroke="#278c8e" stroke-width="4"/><polygon points="920,330 906,322 906,338" fill="#278c8e"/>
<text x="897" y="312" font-family="Malgun Gothic, sans-serif" font-size="22" fill="#163445"></text>
<text x="48" y="578" font-family="Malgun Gothic, sans-serif" font-size="23" fill="#163445">앱키는 계좌에 연결된다. 토큰을 재사용하고, 토큰·시크릿은 로그에 남기지 않는다.</text>
</svg>