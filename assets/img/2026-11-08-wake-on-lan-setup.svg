<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title desc">
  <title id="title">Wake-on-LAN 설정과 시험 순서</title>
  <desc id="desc">유선 랜과 전원을 준비한 뒤 BIOS의 LAN 깨우기, Windows 유선 어댑터의 매직 패킷 설정을 켠다. 같은 LAN에서 절전 깨우기를 시험하고 성공하면 종료와 외부 접속을 따로 확인한다. 실제 설정 화면이 아닌 개념도다.</desc>
  <defs><style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;fill:#193047}.heading{font-size:31px;font-weight:700}.body{font-size:26px;fill:#516779}.num{font-size:31px;font-weight:700;fill:#fff}</style></defs>
  <rect width="1440" height="1080" rx="28" fill="#f3f7fb"/>
  <rect width="1440" height="12" fill="#087e8b"/>
  <text x="64" y="80" font-size="22" font-weight="700" style="fill:#087e8b">SETUP CHECKPOINTS / 02</text>
  <text x="64" y="145" font-size="46" font-weight="700">설정은 세 곳, 첫 시험은 집 안에서</text>
  <text x="64" y="196" class="body">메뉴 이름과 지원 전원 상태는 PC·드라이버·공유기 모델에 따라 다릅니다.</text>
  <path d="M112 292V921" stroke="#c4dbe3" stroke-width="6"/>
  <rect x="162" y="245" width="1214" height="136" rx="20" fill="#fff" stroke="#d5e2eb" stroke-width="2"/>
  <circle cx="112" cy="311" r="33" fill="#087e8b"/><text x="103" y="322" class="num">1</text>
  <text x="194" y="294" class="heading">하드웨어 준비</text>
  <text x="194" y="344" class="body">유선 LAN 연결 · WOL 지원 확인 · 콘센트와 PSU 전원 유지</text>
  <rect x="162" y="405" width="1214" height="136" rx="20" fill="#fff" stroke="#d5e2eb" stroke-width="2"/>
  <circle cx="112" cy="471" r="33" fill="#087e8b"/><text x="103" y="482" class="num">2</text>
  <text x="194" y="454" class="heading">BIOS / UEFI에서 깨우기 허용</text>
  <text x="194" y="504" class="body">Wake on LAN / Power On By PCI-E 활성화 · ErP / Deep Sleep 영향 확인</text>
  <rect x="162" y="565" width="1214" height="136" rx="20" fill="#fff" stroke="#d5e2eb" stroke-width="2"/>
  <circle cx="112" cy="631" r="33" fill="#087e8b"/><text x="103" y="642" class="num">3</text>
  <text x="194" y="614" class="heading">Windows의 유선 네트워크 어댑터 설정</text>
  <text x="194" y="664" class="body">Wake on Magic Packet 활성화 · 이 장치의 절전 해제 허용 · MAC 기록</text>
  <rect x="162" y="725" width="1214" height="136" rx="20" fill="#e0f2ed" stroke="#9ccdbd" stroke-width="2"/>
  <circle cx="112" cy="791" r="33" fill="#087e8b"/><text x="103" y="802" class="num">4</text>
  <text x="194" y="774" class="heading">같은 LAN에서 절전 → 매직 패킷 → 복귀 시험</text>
  <text x="194" y="824" class="body">스마트폰은 집 Wi-Fi · 대상 PC는 유선 · 게스트망과 장치 격리 확인</text>
  <rect x="162" y="885" width="1214" height="136" rx="20" fill="#fff2df" stroke="#e2c99e" stroke-width="2"/>
  <circle cx="112" cy="951" r="33" fill="#aa6a19"/><text x="103" y="962" class="num">5</text>
  <text x="194" y="934" class="heading">성공 후, 종료 상태와 외부 접속을 각각 확인</text>
  <text x="194" y="984" class="body">빠른 시작·S5 지원 별도 확인 · 외부에서는 VPN + 내부 전송 장치 사용</text>
</svg>
